info:
  version: 1.0.0
  description: L25GC-plus UPF-U dataplane configuration

configuration:
  dataplane:
    dn_mac: "26:ac:e5:99:d5:44"
    an_mac: "9e:dc:65:7b:19:7b"
    dc_an_mac: "a6:81:4b:7c:8d:b8"       # DC (secondary) gNB next-hop MAC (node3 enp8s0)

    # NR-DC downlink ECMP is disabled for single-gNB bring-up.
    # Re-add the nrdc block only after validating basic master-gNB data plane.
    nrdc:
      dc_gnb_ip: "192.168.31.1"
      dc_upf_ip: "192.168.31.2"

    upf_ip: "192.168.21.2"

    ports:
      access: 0                     # ACCESS_PORT
      core: 1                       # CORE_PORT (SGi follows CORE)
