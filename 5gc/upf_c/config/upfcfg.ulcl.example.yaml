info:
  version: 1.0.0
  description: UPF configuration

configuration:
  # debugLevel: panic|fatal|error|warn|info|debug|trace
  debugLevel: info
  # ReportCaller: true|false
  ReportCaller: false

  pfcp:
    - addr: 10.200.200.101

  gtpu:
    - addr: 10.200.200.101
    # [optional] gtpu.name
    # - name: upf.5gc.nctu.me
    # [optional] gtpu.ifname
    # - ifname: gtpif

  # Dataplane port mapping (must match UPF-U upf_u.yaml ports)
  # NOTE: SGi follows CORE by convention (same physical port)
  dataplane_ports:
    access: 0
    core: 1
    sgi: 1

  dnn_list:
    - dnn: internet
      cidr: 60.60.0.0/24
      # [optional] dnn_list[*].natifname
      # natifname: eth0
